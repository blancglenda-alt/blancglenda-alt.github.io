/* ======================================================================
   ESTADÍSTICA DESCRIPTIVA — Hoja de estilos
   Sistema de diseño académico moderno para presentación interactiva.
   Identidad visual: Universidad Ecotec (Manual de Marca 2024).
     - Azul institucional  #3155A4 (PANTONE 286U)
     - Celeste de acento   #00B3E6 (PANTONE 306U)
     - Gris azulado neutro #698FA4 (PANTONE 7697U)
     - Azul marino oscuro  #0E223F
     - Tipografía: Poppins (Bold / Regular), la única indicada por el
       manual para piezas gráficas.
   Los colores semánticos de apoyo pedagógico (ámbar/verde/rojo/morado
   para callouts "Importante", "Ejemplo", "Error frecuente", etc.) se
   mantienen porque cumplen una función didáctica, no de marca; el
   acento de marca (celeste) se usa en la navegación, botones y
   elementos interactivos para que la identidad ECOTEC sea reconocible
   sin saturar las diapositivas de azul.
   ====================================================================== */

:root{
  /* ---- Colores oficiales ECOTEC ---- */
  --marca-azul:#3155a4;
  --marca-celeste:#00b3e6;
  --marca-gris:#698fa4;
  --marca-marino:#0e223f;

  --azul-950:#0e223f;
  --azul-900:#132c52;
  --azul-800:#1b3d72;
  --azul-700:#3155a4;
  --azul-600:#3f68bd;
  --azul-500:#6288cf;
  --azul-100:#e7edf8;
  --azul-50:#f4f7fc;

  --celeste-700:#00799e;
  --celeste-600:#0092bd;
  --celeste-500:#00b3e6;
  --celeste-100:#e0f7ff;

  --ambar-600:#c2790f;
  --ambar-500:#e6a01a;
  --ambar-100:#fdf1dc;

  --verde-600:#1c8a5a;
  --verde-500:#22a86e;
  --verde-100:#e2f7ee;

  --rojo-600:#c23b3b;
  --rojo-500:#e04f4f;
  --rojo-100:#fdeaea;

  --morado-600:#6d4fc2;
  --morado-100:#efeafb;

  --tinta-900:#101826;
  --tinta-700:#33415a;
  --tinta-500:#5b6b85;
  --tinta-300:#9aa8bd;
  --tinta-100:#e3e9f2;

  --papel:#f6f8fb;
  --papel-alt:#eef2f8;
  --blanco:#ffffff;

  --fuente-ui:'Poppins',system-ui,-apple-system,Segoe UI,sans-serif;
  --fuente-lectura:'Poppins',system-ui,-apple-system,Segoe UI,sans-serif;

  --radio-s:10px;
  --radio-m:16px;
  --radio-l:22px;

  --sombra-s:0 1px 3px rgba(14,34,63,.08), 0 1px 2px rgba(14,34,63,.06);
  --sombra-m:0 8px 24px rgba(14,34,63,.10), 0 2px 6px rgba(14,34,63,.06);
  --sombra-l:0 20px 50px rgba(14,34,63,.16);

  --topbar-h:60px;
  --controls-h:74px;

  /* ---- Escala tipográfica ampliada (legible desde el fondo del aula) ---- */
  --fs-eyebrow:clamp(15px,1.1vw,18px);
  --fs-title:clamp(34px,3.3vw,52px);
  --fs-subtitle:clamp(23px,2.3vw,34px);
  --fs-hero-title:clamp(36px,4.2vw,58px);
  --fs-hero-subtitle:clamp(22px,1.9vw,30px);
  --fs-lead:clamp(26px,2.1vw,32px);
  --fs-body:clamp(24px,1.75vw,28px);
  --fs-data:clamp(22px,1.55vw,26px);
  --fs-small:clamp(17px,1.3vw,20px);
  --fs-card-title:clamp(22px,1.7vw,27px);
  --fs-formula:clamp(24px,2.3vw,34px);
  --fs-quiz-q:clamp(24px,1.95vw,29px);
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{
  margin:0; padding:0; height:100%;
  background:var(--tinta-900);
  font-family:var(--fuente-ui);
  color:var(--tinta-900);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5{ font-family:var(--fuente-ui); margin:0; line-height:1.15; }
p{ margin:0; }
ul,ol{ margin:0; padding:0; }
button{ font-family:inherit; cursor:pointer; }
a{ color:var(--azul-700); }
svg{ width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* ============================= LOADING ============================= */
#loading-screen{
  position:fixed; inset:0; z-index:999; background:var(--azul-950);
  display:flex; align-items:center; justify-content:center;
  transition:opacity .5s ease, visibility .5s ease;
}
#loading-screen.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
.loading-badge{ text-align:center; color:var(--azul-100); font-weight:600; }
.loading-spinner{
  width:42px; height:42px; margin:0 auto 14px; border-radius:50%;
  border:4px solid rgba(255,255,255,.18); border-top-color:var(--celeste-500);
  animation:spin 0.9s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ============================= LAYOUT BASE ============================= */
#topbar{
  position:fixed; top:0; left:0; right:0; height:var(--topbar-h); z-index:60;
  background:var(--azul-950); color:var(--blanco);
  display:flex; align-items:center; gap:14px; padding:0 16px;
  box-shadow:0 2px 10px rgba(0,0,0,.25);
}
.icon-btn{
  width:38px; height:38px; flex:0 0 auto; border-radius:10px; border:none;
  background:rgba(255,255,255,.08); color:var(--blanco);
  display:flex; align-items:center; justify-content:center;
  transition:background .15s ease, transform .15s ease;
}
.icon-btn svg{ width:19px; height:19px; }
.icon-btn:hover{ background:rgba(255,255,255,.18); }
.icon-btn:active{ transform:scale(.93); }

.topbar-brand{ flex:0 0 auto; height:26px; display:flex; align-items:center; }
.topbar-brand img{ height:100%; width:auto; display:block; }

#topbar-title{ display:flex; flex-direction:column; min-width:0; margin-right:auto; }
.topbar-course{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--celeste-500); font-weight:700; }
#topbar-slide-title{ font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:38vw; }

#topbar-progress-wrap{ display:flex; align-items:center; gap:10px; }
#topbar-progress-track{
  width:min(30vw,260px); height:7px; border-radius:5px; background:rgba(255,255,255,.14); overflow:hidden;
}
#topbar-progress-fill{
  height:100%; width:0%; border-radius:5px;
  background:linear-gradient(90deg,var(--celeste-500),var(--azul-600));
  transition:width .35s ease;
}
#topbar-counter{ font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--tinta-100); font-weight:600; white-space:nowrap; }

#stage{
  position:fixed; top:var(--topbar-h); bottom:var(--controls-h); left:0; right:0;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at top,#16305a 0%, var(--tinta-900) 62%);
  overflow:hidden;
  padding:10px;
}
#slide-viewport{
  width:100%; height:100%; max-width:1680px;
  display:flex; align-items:center; justify-content:center;
  container-type:size; container-name:slidebox;
}
.slide-16x9{
  /* Encaja siempre en 16:9 dentro del espacio disponible, sin recortes ni
     desbordes: se toma el menor de "ancho completo" o "alto completo"
     manteniendo la proporción exacta. Usa unidades de container query
     (relativas a #slide-viewport) en vez de media queries de aspect-ratio,
     que fallan justo cuando la pantalla es exactamente 16:9 (p. ej. proyectores
     Full HD 1920×1080). */
  width:min(100cqw, 100cqh * 16 / 9);
  height:min(100cqh, 100cqw * 9 / 16);
  aspect-ratio:16/9;
  background:var(--papel);
  border-radius:var(--radio-l);
  box-shadow:var(--sombra-l);
  overflow:hidden;
  position:relative;
}

#controls{
  position:fixed; bottom:0; left:0; right:0; height:var(--controls-h); z-index:60;
  background:var(--azul-950); display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; box-shadow:0 -2px 10px rgba(0,0,0,.25);
  gap:12px;
}
.nav-btn{
  display:flex; align-items:center; gap:8px; border:none; border-radius:12px;
  background:var(--azul-700); color:var(--blanco); font-weight:700; font-size:16px;
  padding:12px 22px; transition:background .15s ease, transform .1s ease;
}
.nav-btn svg{ width:19px; height:19px; }
.nav-btn:hover{ background:var(--azul-600); }
.nav-btn:active{ transform:scale(.96); }
.nav-btn:disabled{ opacity:.35; pointer-events:none; }
#btn-next{ background:linear-gradient(135deg,var(--celeste-600),var(--celeste-500)); color:var(--azul-950); }
#btn-next:hover{ filter:brightness(1.08); }

#dot-track{
  flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
  overflow-x:auto; scrollbar-width:none; max-width:60%;
}
#dot-track::-webkit-scrollbar{ display:none; }
.dot{
  width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.25);
  flex:0 0 auto; transition:all .2s ease; cursor:pointer;
}
.dot.section{ width:3px; height:14px; border-radius:2px; background:var(--celeste-500); opacity:.7; }
.dot.active{ background:var(--celeste-500); width:22px; border-radius:5px; }
.dot:hover{ background:rgba(255,255,255,.5); }

/* ============================= TOC LATERAL ============================= */
#toc-overlay{
  position:fixed; inset:0; background:rgba(8,16,30,.55); z-index:70;
  opacity:0; visibility:hidden; transition:opacity .25s ease, visibility .25s ease;
  backdrop-filter:blur(2px);
}
#toc-overlay.open{ opacity:1; visibility:visible; }
#toc-panel{
  position:fixed; top:0; left:0; bottom:0; width:min(400px,88vw); z-index:80;
  background:var(--blanco); box-shadow:var(--sombra-l);
  transform:translateX(-100%); transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
}
#toc-panel.open{ transform:translateX(0); }
#toc-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 20px 14px; border-bottom:1px solid var(--tinta-100);
}
#toc-header h2{ font-size:17px; color:var(--azul-950); }
#toc-header .icon-btn{ background:var(--papel-alt); color:var(--tinta-700); }
#toc-header .icon-btn:hover{ background:var(--tinta-100); }
#toc-list{ overflow-y:auto; padding:10px 10px 30px; flex:1; }

.toc-module{ margin-bottom:6px; }
.toc-module-head{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none;
  background:transparent; padding:11px 10px; border-radius:12px; font-weight:700; color:var(--azul-950);
  font-size:13.5px;
}
.toc-module-head:hover{ background:var(--azul-50); }
.toc-module-head .badge{
  width:26px; height:26px; border-radius:8px; background:var(--azul-800); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; flex:0 0 auto;
}
.toc-module-head .chev{ margin-left:auto; width:14px; height:14px; color:var(--tinta-300); transition:transform .2s ease; }
.toc-module.open .chev{ transform:rotate(90deg); }
.toc-sub{ display:none; padding-left:38px; padding-bottom:6px; }
.toc-module.open .toc-sub{ display:block; }
.toc-item{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:none; background:transparent;
  padding:8px 10px; border-radius:9px; font-size:13px; color:var(--tinta-700);
}
.toc-item:hover{ background:var(--papel-alt); color:var(--azul-800); }
.toc-item.active{ background:var(--azul-100); color:var(--azul-800); font-weight:700; }
.toc-item .n{ font-variant-numeric:tabular-nums; color:var(--tinta-300); font-size:11.5px; width:20px; flex:0 0 auto; }

/* ============================= SLIDE — estructura interna ============================= */
.slide{
  position:absolute; inset:0; display:flex; flex-direction:column;
  padding:clamp(14px,2.2vw,30px) clamp(20px,3vw,42px);
  opacity:0; transform:translateY(14px);
  transition:opacity .38s ease, transform .38s ease;
  pointer-events:none;
  overflow:hidden;
}
.slide.active{ opacity:1; transform:translateY(0); pointer-events:auto; }

.slide-eyebrow{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  font-size:var(--fs-eyebrow); font-weight:800; letter-spacing:.05em; text-transform:uppercase;
  color:var(--azul-700); margin-bottom:8px;
}
.slide-eyebrow .sep{ color:var(--tinta-300); font-weight:400; }
.slide-eyebrow .tag{
  background:var(--azul-100); color:var(--azul-800); padding:3px 12px; border-radius:20px;
}

.slide-title{
  font-size:var(--fs-title); font-weight:800; color:var(--azul-950);
  margin-bottom:4px; letter-spacing:-.01em; line-height:1.08;
}
.slide-subtitle{
  font-size:var(--fs-subtitle); color:var(--marca-gris); font-weight:600; margin-bottom:12px; line-height:1.3;
}
.slide-body{
  flex:1; min-height:0; overflow-y:auto; padding-right:4px;
  display:flex; flex-direction:column; gap:clamp(10px,1.6vh,18px);
}
.slide-body::-webkit-scrollbar{ width:7px; }
.slide-body::-webkit-scrollbar-thumb{ background:var(--tinta-100); border-radius:10px; }

/* ---- Portada / divisores de sección ---- */
.slide.kind-portada, .slide.kind-section, .slide.kind-closing{
  justify-content:center; align-items:flex-start; padding:0;
  background:linear-gradient(135deg,var(--azul-950) 0%, var(--azul-800) 58%, var(--azul-700) 100%);
  color:#fff;
}
.slide.kind-portada .deco, .slide.kind-section .deco, .slide.kind-closing .deco{
  position:absolute; inset:0; overflow:hidden; opacity:.5; pointer-events:none;
}
.slide.kind-portada .deco svg, .slide.kind-section .deco svg, .slide.kind-closing .deco svg{ width:100%; height:100%; }
.hero-inner{
  position:relative; z-index:2; padding:clamp(26px,4.4vw,60px); width:100%;
}
.hero-brand{ position:absolute; top:clamp(20px,3vw,40px); right:clamp(24px,4vw,54px); z-index:3; height:clamp(30px,3.4vw,46px); opacity:.92; }
.hero-brand img{ height:100%; width:auto; display:block; }
.hero-eyebrow{
  display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.12);
  color:var(--celeste-500); font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  font-size:var(--fs-eyebrow); padding:7px 16px; border-radius:30px; margin-bottom:18px;
}
.hero-title{
  font-size:var(--fs-hero-title); font-weight:800; line-height:1.08; letter-spacing:-.02em;
  max-width:20ch; margin-bottom:14px;
}
.hero-title em{ font-style:normal; color:var(--celeste-500); }
.hero-subtitle{
  font-family:var(--fuente-lectura); font-style:italic; font-size:var(--fs-hero-subtitle);
  color:var(--azul-100); max-width:56ch; line-height:1.5;
}
.hero-meta{
  margin-top:22px; display:flex; gap:30px; flex-wrap:wrap;
}
.hero-meta div{ font-size:clamp(15px,1.2vw,18px); color:var(--azul-100); }
.hero-meta b{ display:block; font-size:clamp(18px,1.5vw,22px); color:#fff; }
.hero-objectives{
  margin-top:24px; display:flex; flex-direction:column; gap:11px; max-width:60ch;
}
.hero-objectives .obj{
  display:flex; gap:12px; align-items:flex-start; background:rgba(255,255,255,.08);
  padding:13px 17px; border-radius:14px; font-size:var(--fs-body); line-height:1.4;
}
.hero-objectives .obj .ico{
  width:26px; height:26px; border-radius:7px; background:var(--celeste-500); color:var(--azul-950);
  flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; margin-top:2px;
}

/* ============================= BLOQUES DE CONTENIDO ============================= */
.b-lead{
  font-family:var(--fuente-lectura); font-size:var(--fs-lead); font-style:italic;
  color:var(--azul-900); line-height:1.45; border-left:4px solid var(--celeste-500);
  padding:4px 0 4px 18px;
}
.b-paragraph{ font-size:var(--fs-body); color:var(--tinta-700); line-height:1.55; max-width:96ch; }
.b-paragraph strong{ color:var(--azul-900); }

.b-list{ display:flex; flex-direction:column; gap:10px; }
.b-list li{
  display:flex; gap:11px; align-items:flex-start; font-size:var(--fs-body);
  color:var(--tinta-700); line-height:1.45;
}
.b-list.bulleted li::before{
  content:''; width:8px; height:8px; margin-top:9px; border-radius:2px; background:var(--azul-600); flex:0 0 auto;
}
.b-list.ordered{ counter-reset:ol; }
.b-list.ordered li{ counter-increment:ol; }
.b-list.ordered li::before{
  content:counter(ol); flex:0 0 auto; width:28px; height:28px; border-radius:50%;
  background:var(--azul-700); color:#fff; font-size:14px; font-weight:800;
  display:flex; align-items:center; justify-content:center; margin-top:1px;
}
.b-list.check li::before{
  content:'✓'; flex:0 0 auto; width:24px; height:24px; border-radius:6px;
  background:var(--verde-100); color:var(--verde-600); font-size:14px; font-weight:900;
  display:flex; align-items:center; justify-content:center; margin-top:1px;
}

.b-cards{ display:grid; gap:14px; }
.b-cards.c2{ grid-template-columns:repeat(2,1fr); }
.b-cards.c3{ grid-template-columns:repeat(3,1fr); }
.b-cards.c4{ grid-template-columns:repeat(4,1fr); }
.b-cards.c5{ grid-template-columns:repeat(5,1fr); }
.card{
  background:var(--blanco); border:1px solid var(--tinta-100); border-radius:var(--radio-m);
  padding:16px 18px; box-shadow:var(--sombra-s); display:flex; flex-direction:column; gap:7px;
}
.card .card-ico{
  width:38px; height:38px; border-radius:11px; background:var(--azul-100); color:var(--azul-700);
  display:flex; align-items:center; justify-content:center; font-size:19px; margin-bottom:2px;
}
.card .card-title{ font-weight:800; font-size:var(--fs-card-title); color:var(--azul-950); line-height:1.25; }
.card .card-text{ font-size:var(--fs-data); color:var(--tinta-500); line-height:1.4; }
.card.accent{ background:var(--azul-950); border-color:var(--azul-950); }
.card.accent .card-title, .card.accent .card-text{ color:#fff; }
.card.accent .card-ico{ background:rgba(255,255,255,.15); color:var(--celeste-500); }

.b-table{ overflow:auto; border-radius:var(--radio-m); border:1px solid var(--tinta-100); box-shadow:var(--sombra-s); }
.b-table table{ width:100%; border-collapse:collapse; font-size:var(--fs-data); background:#fff; }
.b-table caption{ caption-side:top; text-align:left; font-size:var(--fs-eyebrow); font-weight:700; color:var(--azul-800); padding:11px 16px; background:var(--azul-50); }
.b-table th{
  background:var(--azul-900); color:#fff; text-align:left; padding:13px 16px; font-weight:700; font-size:.9em;
  white-space:nowrap;
}
.b-table td{ padding:12px 16px; border-bottom:1px solid var(--papel-alt); color:var(--tinta-700); }
.b-table tr:last-child td{ border-bottom:none; }
.b-table tr:nth-child(even) td{ background:var(--papel); }
.b-table td.num, .b-table th.num{ text-align:right; font-variant-numeric:tabular-nums; }
.b-table td.hl{ background:var(--ambar-100)!important; font-weight:800; color:var(--ambar-600); }

.b-callout{
  display:flex; gap:14px; padding:16px 20px; border-radius:var(--radio-m); border:1px solid transparent;
  font-size:var(--fs-body); line-height:1.45;
}
.b-callout .co-ico{
  flex:0 0 auto; width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-weight:900; font-size:17px;
}
.b-callout .co-title{ font-weight:800; margin-bottom:2px; display:block; }
.b-callout.importante{ background:var(--azul-50); border-color:var(--azul-100); color:var(--azul-900); }
.b-callout.importante .co-ico{ background:var(--azul-700); color:#fff; }
.b-callout.recuerda{ background:var(--morado-100); border-color:#e2d9f7; color:#3d2c6e; }
.b-callout.recuerda .co-ico{ background:var(--morado-600); color:#fff; }
.b-callout.ejemplo{ background:var(--verde-100); border-color:#cdeee0; color:#124d34; }
.b-callout.ejemplo .co-ico{ background:var(--verde-600); color:#fff; }
.b-callout.error{ background:var(--rojo-100); border-color:#f8d6d6; color:#6b1f1f; }
.b-callout.error .co-ico{ background:var(--rojo-600); color:#fff; }
.b-callout.aplicacion{ background:var(--ambar-100); border-color:#f7e2b8; color:#6e4708; }
.b-callout.aplicacion .co-ico{ background:var(--ambar-600); color:#fff; }

.b-quote{
  background:var(--azul-950); color:#fff; border-radius:var(--radio-m); padding:22px 26px;
  font-family:var(--fuente-lectura); font-style:italic; font-size:var(--fs-lead); position:relative;
}
.b-quote::before{ content:'“'; font-size:2.4em; color:var(--celeste-500); opacity:.7; position:absolute; top:-6px; left:14px; font-family:Georgia,serif; }
.b-quote .q-text{ position:relative; z-index:1; padding-left:16px; }
.b-quote .q-author{ display:block; margin-top:12px; font-family:var(--fuente-ui); font-style:normal; font-weight:700; font-size:.62em; color:var(--celeste-500); }

/* ---- Comparación de columnas ---- */
.b-compare{ display:grid; gap:16px; grid-auto-flow:column; grid-auto-columns:1fr; }
.cmp-col{ border-radius:var(--radio-m); padding:17px 19px; border:1.5px solid var(--tinta-100); background:#fff; }
.cmp-col .cmp-head{ display:flex; align-items:center; gap:9px; margin-bottom:10px; }
.cmp-col .cmp-dot{ width:13px; height:13px; border-radius:50%; }
.cmp-col .cmp-title{ font-weight:800; font-size:var(--fs-card-title); color:var(--azul-950); }
.cmp-col ul{ display:flex; flex-direction:column; gap:8px; }
.cmp-col li{ font-size:var(--fs-data); color:var(--tinta-700); line-height:1.4; padding-left:15px; position:relative; }
.cmp-col li::before{ content:'—'; position:absolute; left:0; color:var(--tinta-300); }

/* ---- Fórmulas ---- */
.b-formula{
  background:linear-gradient(135deg,var(--azul-950),var(--azul-800)); color:#fff; border-radius:var(--radio-m);
  padding:20px 24px; display:flex; flex-direction:column; gap:11px;
}
.b-formula .f-label{ font-size:var(--fs-eyebrow); text-transform:uppercase; letter-spacing:.07em; font-weight:800; color:var(--celeste-500); }
.b-formula .f-expr{ font-size:var(--fs-formula); overflow-x:auto; padding:4px 0; }
.b-formula .f-expr .katex{ color:#fff; font-size:1em; }
.b-formula .f-vars{ display:flex; flex-wrap:wrap; gap:9px 22px; margin-top:2px; }
.b-formula .f-vars div{ font-size:var(--fs-data); color:var(--azul-100); display:flex; gap:7px; }
.b-formula .f-vars .sym{ font-weight:800; color:#fff; min-width:1.2em; }
.b-formula .f-note{ font-size:var(--fs-data); color:var(--azul-100); font-style:italic; border-top:1px solid rgba(255,255,255,.15); padding-top:9px; }
.formula-mini{ display:inline-block; }
.formula-inline .katex{ font-size:1.02em; }

.b-formularow{ display:grid; gap:14px; }
.b-formularow.c2{ grid-template-columns:1fr 1fr; }
.b-formularow.c3{ grid-template-columns:1fr 1fr 1fr; }

/* ============================= EJERCICIOS ============================= */
.exercise{
  border:1.5px solid var(--tinta-100); border-radius:var(--radio-l); background:#fff; overflow:hidden;
  box-shadow:var(--sombra-s);
}
.exercise.practice{ border-color:var(--celeste-100); }
.ex-head{
  background:var(--azul-950); color:#fff; padding:12px 20px; display:flex; align-items:center; gap:10px 12px;
  flex-wrap:wrap;
}
.exercise.demo .ex-head{ background:linear-gradient(135deg,var(--verde-600),#16704a); }
.exercise.practice .ex-head{ background:linear-gradient(135deg,var(--celeste-700),var(--azul-700)); }
.ex-head .ex-badge{
  background:var(--celeste-500); color:var(--azul-950); font-weight:900; font-size:var(--fs-eyebrow); letter-spacing:.04em;
  padding:5px 13px; border-radius:20px; text-transform:uppercase; white-space:nowrap;
}
.exercise.demo .ex-head .ex-badge{ background:var(--verde-100); color:#124d34; }
.ex-head h4{ font-size:var(--fs-card-title); font-weight:800; }
.ex-body{ padding:16px 22px; display:flex; flex-direction:column; gap:12px; }
.ex-statement{ font-size:var(--fs-body); color:var(--tinta-700); line-height:1.4; }
.ex-statement b{ color:var(--azul-900); }
.ex-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.ex-box{ background:var(--papel); border-radius:12px; padding:11px 16px; }
.ex-box .ex-box-label{ font-size:var(--fs-eyebrow); text-transform:uppercase; letter-spacing:.06em; font-weight:800; color:var(--azul-700); margin-bottom:3px; display:block; }
.ex-box .ex-box-text{ font-size:var(--fs-data); color:var(--tinta-700); line-height:1.3; }

/* ---- ¿Qué se pide? preguntas numeradas del ejercicio ---- */
.ex-ask{ background:var(--celeste-100); border:1.5px solid #b9ecfc; border-radius:12px; padding:11px 16px; }
.ex-ask .ex-box-label{ color:var(--celeste-700); }
.ex-ask ol{ display:flex; flex-direction:column; gap:5px; counter-reset:ask; margin-top:3px; }
.ex-ask ol li{
  display:flex; gap:10px; align-items:flex-start; font-size:var(--fs-data); color:var(--azul-950); line-height:1.4;
  counter-increment:ask;
}
.ex-ask ol li::before{
  content:counter(ask); flex:0 0 auto; width:24px; height:24px; border-radius:50%;
  background:var(--celeste-600); color:#fff; font-size:12.5px; font-weight:800;
  display:flex; align-items:center; justify-content:center; margin-top:1px;
}

.ex-trybar{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
.btn-try{
  border:none; border-radius:12px; padding:12px 20px; font-weight:800; font-size:clamp(17px,1.4vw,20px);
  background:var(--celeste-500); color:var(--azul-950); display:flex; align-items:center; gap:8px;
  transition:filter .15s ease, transform .1s ease;
}
.btn-try:hover{ filter:brightness(1.06); }
.btn-try:active{ transform:scale(.97); }
.btn-try.secondary{ background:var(--azul-100); color:var(--azul-800); }
.ex-hint{ font-size:var(--fs-small); color:var(--tinta-500); font-style:italic; }

.ex-steps{ display:none; flex-direction:column; gap:9px; border-top:1px dashed var(--tinta-100); padding-top:12px; }
.ex-steps.shown{ display:flex; }
.ex-step{ display:flex; gap:13px; }
.ex-step .step-n{
  flex:0 0 auto; width:28px; height:28px; border-radius:50%; background:var(--azul-800); color:#fff;
  font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center;
}
.ex-step .step-body{ flex:1; padding-top:1px; }
.ex-step .step-title{ font-weight:800; font-size:var(--fs-data); color:var(--azul-950); margin-bottom:2px; }
.ex-step .step-text{ font-size:var(--fs-data); color:var(--tinta-700); line-height:1.35; }
.ex-step .step-katex{ margin-top:5px; background:var(--papel); border-radius:10px; padding:9px 14px; overflow-x:auto; font-size:1.02em; }

.ex-answer{
  display:none; margin-top:0; background:var(--verde-100); border:1.5px solid #bfe9d4; border-radius:14px;
  padding:13px 18px; align-items:center; gap:14px;
}
.ex-answer.shown{ display:flex; }
.ex-answer .aw-ico{ width:38px; height:38px; border-radius:50%; background:var(--verde-600); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; flex:0 0 auto; font-size:18px; }
.ex-answer .aw-text{ font-size:var(--fs-body); color:#124d34; }
.ex-answer .aw-text b{ font-size:1.25em; }

.ex-why{ display:none; font-size:var(--fs-data); color:var(--tinta-500); font-style:italic; border-left:3px solid var(--tinta-100); padding-left:13px; }
.ex-why.shown{ display:block; }

/* ============================= QUIZ / COMPROBACIÓN ============================= */
.quiz{ background:#fff; border:1.5px solid var(--tinta-100); border-radius:var(--radio-l); padding:20px 24px; box-shadow:var(--sombra-s); }
.quiz-tag{
  display:inline-flex; align-items:center; gap:6px; background:var(--morado-100); color:var(--morado-600);
  font-weight:800; font-size:var(--fs-eyebrow); text-transform:uppercase; letter-spacing:.05em; padding:5px 13px; border-radius:20px; margin-bottom:12px;
}
.quiz-q{ font-size:var(--fs-quiz-q); font-weight:700; color:var(--azul-950); margin-bottom:15px; line-height:1.35; }
.quiz-opts{ display:grid; gap:11px; grid-template-columns:1fr 1fr; }
.quiz-opt{
  text-align:left; border:1.5px solid var(--tinta-100); background:var(--papel); border-radius:12px;
  padding:13px 16px; font-size:var(--fs-data); color:var(--tinta-700); display:flex; gap:10px; align-items:flex-start;
  transition:border-color .15s ease, background .15s ease; line-height:1.35;
}
.quiz-opt:hover{ border-color:var(--celeste-500); background:var(--celeste-100); }
.quiz-opt .opt-letter{
  flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:var(--tinta-100); color:var(--tinta-700);
  font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center;
}
.quiz-opt.correct{ border-color:var(--verde-500); background:var(--verde-100); color:#124d34; }
.quiz-opt.correct .opt-letter{ background:var(--verde-600); color:#fff; }
.quiz-opt.incorrect{ border-color:var(--rojo-500); background:var(--rojo-100); color:#6b1f1f; }
.quiz-opt.incorrect .opt-letter{ background:var(--rojo-600); color:#fff; }
.quiz-opt:disabled{ pointer-events:none; }
.quiz-opt.dim{ opacity:.5; }
.quiz-feedback{
  display:none; margin-top:14px; padding:14px 18px; border-radius:12px; font-size:var(--fs-data); line-height:1.45;
  align-items:flex-start; gap:11px;
}
.quiz-feedback.shown{ display:flex; }
.quiz-feedback.ok{ background:var(--verde-100); color:#124d34; }
.quiz-feedback.bad{ background:var(--ambar-100); color:#6e4708; }

/* ============================= REFLEXIÓN ============================= */
.reflect{
  background:linear-gradient(135deg,var(--morado-600),#8a6fe0); color:#fff; border-radius:var(--radio-l);
  padding:20px 24px; display:flex; gap:16px; align-items:center;
}
.reflect .rf-ico{ font-size:30px; flex:0 0 auto; }
.reflect .rf-text{ font-size:var(--fs-lead); font-weight:700; line-height:1.35; font-family:var(--fuente-lectura); font-style:italic; }
.reflect .rf-hint{ font-size:var(--fs-small); opacity:.85; margin-top:6px; font-family:var(--fuente-ui); font-style:normal; }

/* ============================= PASOS NUMERADOS (steps) ============================= */
.stepline{ display:grid; gap:14px; grid-auto-flow:column; grid-auto-columns:1fr; }
.stepline .sl-item{ background:#fff; border:1.5px solid var(--tinta-100); border-radius:var(--radio-m); padding:16px 18px; position:relative; }
.stepline .sl-item .sl-num{
  width:34px; height:34px; border-radius:9px; background:var(--azul-700); color:#fff; font-weight:900; font-size:16px;
  display:flex; align-items:center; justify-content:center; margin-bottom:9px;
}
.stepline .sl-item .sl-title{ font-weight:800; font-size:var(--fs-data); color:var(--azul-950); margin-bottom:4px; line-height:1.3; }
.stepline .sl-item .sl-text{ font-size:var(--fs-small); color:var(--tinta-500); line-height:1.4; }
.stepline .sl-arrow{ display:none; }
@media(min-width:900px){
  .stepline{ align-items:stretch; }
}

/* ============================= GRÁFICOS (SVG) ============================= */
.chart-wrap{ background:#fff; border:1.5px solid var(--tinta-100); border-radius:var(--radio-l); padding:18px 22px 14px; box-shadow:var(--sombra-s); display:flex; flex-direction:column; max-width:920px; margin-left:auto; margin-right:auto; width:100%; }
.split-col .chart-wrap{ max-width:none; margin-left:0; margin-right:0; }
.chart-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; flex-wrap:wrap; gap:6px; }
.chart-title{ font-weight:800; font-size:var(--fs-card-title); color:var(--azul-950); }
.chart-svg-box{ width:100%; flex:1; min-height:0; display:flex; align-items:center; }
.chart-svg-box svg{ width:100%; height:auto; display:block; overflow:visible; }
.chart-caption{ font-size:var(--fs-small); color:var(--tinta-500); margin-top:8px; }
.chart-questions{ margin-top:12px; display:flex; flex-direction:column; gap:7px; }
.chart-questions .cq{ font-size:var(--fs-data); color:var(--azul-800); background:var(--azul-50); border-radius:9px; padding:9px 13px; }

/* ============================= LAYOUT DE 2 COLUMNAS PARA SLIDE ============================= */
.split{ display:grid; gap:20px; grid-template-columns:1fr 1fr; flex:1; min-height:0; }
.split.left-wide{ grid-template-columns:1.25fr 1fr; }
.split.right-wide{ grid-template-columns:1fr 1.25fr; }
.split-col{ display:flex; flex-direction:column; gap:14px; min-height:0; overflow-y:auto; padding-right:4px; }
/* Evita que las tarjetas con overflow:hidden (ejercicios, gráficos, etc.)
   se compriman de forma invisible dentro de un contenedor flex más chico
   que su contenido: sin esto, el motor de flexbox puede "encoger" una
   tarjeta hasta recortar texto sin mostrar scroll ni aviso alguno. Al
   fijar flex-shrink:0, si el contenido no cabe, el que hace scroll es el
   contenedor (.split-col / .slide-body), nunca la tarjeta misma. */
.split-col > .reveal-item, .slide-body > .reveal-item{ flex-shrink:0; }

/* ============================= CIERRE ============================= */
.closing-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-top:24px; max-width:960px; }
.closing-grid .card{ background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.18); }
.closing-grid .card .card-title, .closing-grid .card .card-text{ color:#fff; }
.closing-grid .card .card-text{ color:var(--azul-100); }

/* ============================= MARCA ECOTEC — pie de portada/cierre ============================= */
.brand-footer{ position:absolute; left:0; right:0; bottom:clamp(18px,3vw,32px); z-index:2; display:flex; align-items:center; gap:10px; padding:0 clamp(26px,4.4vw,60px); }
.brand-footer img{ height:clamp(18px,1.8vw,24px); width:auto; opacity:.85; }
.brand-footer span{ font-size:12px; color:var(--azul-100); opacity:.75; letter-spacing:.03em; }

/* ============================= RESPONSIVE ============================= */
@media (max-width:900px){
  .b-cards.c3, .b-cards.c4, .b-cards.c5{ grid-template-columns:repeat(2,1fr); }
  .b-compare{ grid-auto-flow:row; }
  .ex-grid{ grid-template-columns:1fr; }
  .quiz-opts{ grid-template-columns:1fr; }
  .stepline{ grid-auto-flow:row; }
  .split{ grid-template-columns:1fr!important; }
  #topbar-slide-title{ max-width:24vw; }
}
@media (max-width:640px){
  .b-cards.c2, .b-cards.c3, .b-cards.c4, .b-cards.c5{ grid-template-columns:1fr; }
  #topbar-progress-track{ width:22vw; }
  #topbar-slide-title{ display:none; }
}

/* En pantallas angostas (celular en vertical) se prioriza aprovechar el
   espacio disponible sobre mantener estrictamente 16:9, que es la
   relación pensada para computadora / proyector. */
@media (max-width:700px){
  #stage{ padding:8px; }
  .slide-16x9{ width:100%!important; height:100%!important; aspect-ratio:auto; border-radius:14px; }
  .ex-grid{ grid-template-columns:1fr; }
  .b-formularow.c2, .b-formularow.c3{ grid-template-columns:1fr; }
  .stepline{ grid-auto-flow:row; }
}

/* ============================= REVEAL PROGRESIVO ============================= */
.reveal-item{ opacity:0; transform:translateY(8px); transition:opacity .4s ease, transform .4s ease; }
.reveal-item.in{ opacity:1; transform:translateY(0); }

/* ============================= UTILIDADES ============================= */
.muted{ color:var(--tinta-500); }
.text-center{ text-align:center; }
.mono-num{ font-variant-numeric:tabular-nums; }
.pill{
  display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; padding:4px 12px;
  border-radius:20px; background:var(--azul-100); color:var(--azul-800); text-transform:uppercase; letter-spacing:.04em;
}
.pill.verde{ background:var(--verde-100); color:var(--verde-600); }
.pill.ambar{ background:var(--ambar-100); color:var(--ambar-600); }
.pill.rojo{ background:var(--rojo-100); color:var(--rojo-600); }

</style>

/* ======================================================================
   content-base.js — Punto de partida de los datos de la presentación.

   CÓMO EDITAR ESTA PRESENTACIÓN
   ------------------------------------------------------------------
   Todo el contenido académico (textos, ejercicios, preguntas, datos de
   gráficos) vive en los archivos "content-*.js", organizados por tema:

     content-base.js   -> este archivo (no contiene texto de clase)
     content-curso.js  -> portada, bienvenida, normas, evaluación
     content-t11.js    -> Tema 1.1 Introducción a la estadística
     content-t12.js    -> Tema 1.2 Representación gráfica de datos
     content-t13.js    -> Tema 1.3 Medidas de tendencia central
     content-t14a.js   -> Tema 1.4  Medidas de dispersión
     content-t14b.js   -> Tema 1.4  Medidas de posición (percentiles)
     content-t14c.js   -> Tema 1.4  Diagrama de caja (boxplot)
     content-cierre.js -> resumen y cierre de la unidad

   Cada archivo agrega uno o más "módulos" a COURSE.modules. Un módulo
   agrupa varias diapositivas (slides). Para modificar un texto, busca
   la diapositiva por su título o su "id" y edita directamente el
   valor correspondiente (son cadenas de texto normales, se puede usar
   <strong>negrita</strong> o <br> si se desea). No es necesario tocar
   app.js ni charts.js para cambiar textos, agregar preguntas o editar
   ejercicios.

   TIPOS DE BLOQUE DISPONIBLES (propiedad "type" dentro de blocks:[...]):
     lead        -> idea principal destacada (cita corta en cursiva)
     paragraph   -> párrafo de texto
     list        -> lista { items:[...], ordered?, check? }
     cards       -> tarjetas { columns:2-4, items:[{icon,title,text}] }
     table       -> tabla { headers:[...], rows:[[...]], caption? }
     callout     -> recuadro { variant: importante|recuerda|ejemplo|error|aplicacion, title?, text }
     formula     -> fórmula destacada { label?, expr (LaTeX), vars:[{symbol,desc}], note? }
     formularow  -> varias fórmulas en fila { columns, formulas:[ {..como formula} ] }
     compare     -> columnas comparativas { columns:[{title,color,items:[...]}] }
     quote       -> cita { text, author }
     steps       -> secuencia de pasos horizontal { title?, items:[{title,text}] }
     chart       -> gráfico SVG { chartType: bar|histogram|line|scatter|boxplot, data:{...}, title, caption?, questions? }
     exercise    -> ejercicio resuelto con "Intentar primero"/"Ver solución"
     quiz        -> pregunta de opción múltiple con retroalimentación
     reflect     -> pregunta reflexiva tipo "¿Qué crees que pasaría si...?"
   ------------------------------------------------------------------ */

const COURSE = {

};

<script>
/* ======================================================================
   charts.js — Generador de gráficos estadísticos en SVG puro (sin
   librerías externas de gráficos). Se usan funciones simples de escala
   lineal para ubicar barras, puntos, líneas y cajas dentro de un
   viewBox fijo (900 x 420) que luego se escala de forma responsiva
   mediante CSS (width:100%; height:auto;).
   ====================================================================== */

const CHART_NS = 'http://www.w3.org/2000/svg';
const CHART_W = 900, CHART_H = 420;
const PAD = { top: 34, right: 26, bottom: 62, left: 70 };

const PALETTE = {
  azul: '#3155a4', azulOsc: '#0e223f', celeste: '#00b3e6', ambar: '#e6a01a', verde: '#22a86e',
  rojo: '#e04f4f', morado: '#6d4fc2', gris: '#c7d0dd', texto: '#33415a'
};

function svgEl(tag, attrs = {}, children = []) {
  const node = document.createElementNS(CHART_NS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  children.forEach(c => node.appendChild(c));
  return node;
}

function niceMax(v) {
  if (v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v / mag;
  let nice;
  if (norm <= 1) nice = 1; else if (norm <= 2) nice = 2; else if (norm <= 5) nice = 5; else nice = 10;
  return nice * mag;
}

function baseCanvas() {
  return svgEl('svg', { viewBox: `0 0 ${CHART_W} ${CHART_H}`, preserveAspectRatio: 'xMidYMid meet' });
}

function axisY(svg, yScale, yMax, yMin, unit, ticks = 5) {
  const g = svgEl('g', { class: 'axis-y' });
  for (let i = 0; i <= ticks; i++) {
    const val = yMin + (yMax - yMin) * (i / ticks);
    const y = yScale(val);
    g.appendChild(svgEl('line', { x1: PAD.left, x2: CHART_W - PAD.right, y1: y, y2: y, stroke: '#e3e9f2', 'stroke-width': 1 }));
    g.appendChild(svgEl('text', { x: PAD.left - 10, y: y + 4, 'text-anchor': 'end', 'font-size': 17, fill: PALETTE.texto, 'font-family': 'Poppins,sans-serif', 'font-weight': 600 }, []));
    g.lastChild.textContent = round1(val) + (unit || '');
  }
  svg.appendChild(g);
}

function round1(n) { return Math.round(n * 10) / 10; }

function axisXLabels(svg, xs, labels, y) {
  labels.forEach((lab, i) => {
    const t = svgEl('text', {
      x: xs[i], y: y + 26, 'text-anchor': 'middle', 'font-size': 16, fill: PALETTE.texto, 'font-family': 'Poppins,sans-serif', 'font-weight': 600
    });
    t.textContent = lab;
    svg.appendChild(t);
  });
}

/* ---------------------------- GRÁFICO DE BARRAS ---------------------------- */
function chartBar(opts) {
  const { labels, values, unit = '', colorVariant = 'azul', highlightIndex = -1, yMinOverride = null, valueLabels = true } = opts;
  const svg = baseCanvas();
  const innerW = CHART_W - PAD.left - PAD.right;
  const innerH = CHART_H - PAD.top - PAD.bottom;
  const dataMax = Math.max(...values);
  const yMax = niceMax(dataMax * 1.15);
  const yMin = yMinOverride !== null ? yMinOverride : 0;
  const yScale = v => PAD.top + innerH - ((v - yMin) / (yMax - yMin)) * innerH;

  axisY(svg, yScale, yMax, yMin, unit);
  svg.appendChild(svgEl('line', { x1: PAD.left, x2: PAD.left, y1: PAD.top, y2: CHART_H - PAD.bottom, stroke: '#9aa8bd', 'stroke-width': 1.4 }));
  svg.appendChild(svgEl('line', { x1: PAD.left, x2: CHART_W - PAD.right, y1: CHART_H - PAD.bottom, y2: CHART_H - PAD.bottom, stroke: '#9aa8bd', 'stroke-width': 1.4 }));

  const n = values.length;
  const slot = innerW / n;
  const barW = Math.min(64, slot * 0.55);
  const xs = [];

  values.forEach((v, i) => {
    const cx = PAD.left + slot * i + slot / 2;
    xs.push(cx);
    const y = yScale(v);
    const baseY = yScale(yMin);
    const color = i === highlightIndex ? PALETTE.ambar : PALETTE[colorVariant] || PALETTE.azul;
    svg.appendChild(svgEl('rect', {
      x: cx - barW / 2, y: Math.min(y, baseY), width: barW, height: Math.abs(baseY - y),
      rx: 6, fill: color
    }));
    if (valueLabels) {
      const t = svgEl('text', { x: cx, y: y - 10, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 800, fill: PALETTE.azulOsc, 'font-family': 'Poppins,sans-serif' });
      t.textContent = v + unit;
      svg.appendChild(t);
    }
  });
  axisXLabels(svg, xs, labels, CHART_H - PAD.bottom);
  return svg;
}

/* ---------------------------- HISTOGRAMA ---------------------------- */
function chartHistogram(opts) {
  const { bins, xLabel = '', yLabel = 'Frecuencia', highlightIndex = -1 } = opts; // bins:[{label,freq}]
  const svg = baseCanvas();
  const innerW = CHART_W - PAD.left - PAD.right;
  const innerH = CHART_H - PAD.top - PAD.bottom;
  const freqs = bins.map(b => b.freq);
  const yMax = niceMax(Math.max(...freqs) * 1.2);
  const yScale = v => PAD.top + innerH - (v / yMax) * innerH;

  axisY(svg, yScale, yMax, 0, '');
  svg.appendChild(svgEl('line', { x1: PAD.left, x2: PAD.left, y1: PAD.top, y2: CHART_H - PAD.bottom, stroke: '#9aa8bd', 'stroke-width': 1.4 }));
  svg.appendChild(svgEl('line', { x1: PAD.left, x2: CHART_W - PAD.right, y1: CHART_H - PAD.bottom, y2: CHART_H - PAD.bottom, stroke: '#9aa8bd', 'stroke-width': 1.4 }));

  const n = bins.length;
  const slot = innerW / n;
  const xs = [];
  bins.forEach((b, i) => {
    const x = PAD.left + slot * i;
    xs.push(x + slot / 2);
    const y = yScale(b.freq);
    const base = yScale(0);
    const color = i === highlightIndex ? PALETTE.ambar : PALETTE.azul;
    svg.appendChild(svgEl('rect', { x: x + 2, y, width: slot - 4, height: base - y, fill: color, stroke: '#fff', 'stroke-width': 2 }));
    const t = svgEl('text', { x: x + slot / 2, y: y - 8, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 800, fill: PALETTE.azulOsc, 'font-family': 'Poppins,sans-serif' });
    t.textContent = b.freq;
    svg.appendChild(t);
  });
  axisXLabels(svg, xs, bins.map(b => b.label), CHART_H - PAD.bottom);

  if (xLabel) {
    const t = svgEl('text', { x: CHART_W / 2, y: CHART_H - 6, 'text-anchor': 'middle', 'font-size': 15, fill: PALETTE.texto, 'font-family': 'Poppins,sans-serif', 'font-style': 'italic' });
    t.textContent = xLabel;
    svg.appendChild(t);
  }
  return svg;
}

/* ---------------------------- GRÁFICO DE LÍNEAS ---------------------------- */
function chartLine(opts) {
  const { labels, values, unit = '', markMax = true, markMin = false } = opts;
  const svg = baseCanvas();
  const innerW = CHART_W - PAD.left - PAD.right;
  const innerH = CHART_H - PAD.top - PAD.bottom;
  const dataMax = Math.max(...values), dataMin = Math.min(0, Math.min(...values));
  const yMax = niceMax(dataMax * 1.15);
  const yScale = v => PAD.top + innerH - ((v - dataMin) / (yMax - dataMin)) * innerH;

  axisY(svg, yScale, yMax, dataMin, unit);
  svg.appendChild(svgEl('line', { x1: PAD.left, x2: PAD.left, y1: PAD.top, y2: CHART_H - PAD.bottom, stroke: '#9aa8bd', 'stroke-width': 1.4 }));
  svg.appendChild(svgEl('line', { x1: PAD.left, x2: CHART_W - PAD.right, y1: CHART_H - PAD.bottom, y2: CHART_H - PAD.bottom, stroke: '#9aa8bd', 'stroke-width': 1.4 }));

  const n = values.length;
  const slot = innerW / (n - 1 || 1);
  const xs = values.map((v, i) => PAD.left + slot * i);
  const ys = values.map(v => yScale(v));

  const areaPts = xs.map((x, i) => `${x},${ys[i]}`).join(' ') + ` ${xs[n - 1]},${yScale(dataMin)} ${xs[0]},${yScale(dataMin)}`;
  svg.appendChild(svgEl('polygon', { points: areaPts, fill: PALETTE.azul, opacity: 0.12 }));

  const linePts = xs.map((x, i) => `${x},${ys[i]}`).join(' ');
  svg.appendChild(svgEl('polyline', { points: linePts, fill: 'none', stroke: PALETTE.azul, 'stroke-width': 3 }));

  const maxIdx = values.indexOf(Math.max(...values));
  const minIdx = values.indexOf(Math.min(...values));
  xs.forEach((x, i) => {
    let color = PALETTE.azulOsc, r = 4.5;
    if (markMax && i === maxIdx) { color = PALETTE.verde; r = 6.5; }
    if (markMin && i === minIdx) { color = PALETTE.rojo; r = 6.5; }
    svg.appendChild(svgEl('circle', { cx: x, cy: ys[i], r, fill: color, stroke: '#fff', 'stroke-width': 2 }));
    if (i === maxIdx || i === minIdx) {
      const t = svgEl('text', { x, y: ys[i] - 12, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 800, fill: color, 'font-family': 'Poppins,sans-serif' });
      t.textContent = values[i] + unit;
      svg.appendChild(t);
    }
  });
  const step = Math.ceil(n / 15);
  axisXLabels(svg, xs.filter((_, i) => i % step === 0), labels.filter((_, i) => i % step === 0), CHART_H - PAD.bottom);
  return svg;
}

/* ---------------------------- DIAGRAMA DE DISPERSIÓN ---------------------------- */
function chartScatter(opts) {
  const { points, xLabel = '', yLabel = '', trend = true } = opts; // points:[{x,y,label}]
  const svg = baseCanvas();
  const innerW = CHART_W - PAD.left - PAD.right;
  const innerH = CHART_H - PAD.top - PAD.bottom;
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  const xMax = niceMax(Math.max(...xs) * 1.15), xMin = 0;
  const yMax = niceMax(Math.max(...ys) * 1.15), yMin = 0;
  const xScale = v => PAD.left + ((v - xMin) / (xMax - xMin)) * innerW;
  const yScale = v => PAD.top + innerH - ((v - yMin) / (yMax - yMin)) * innerH;

  axisY(svg, yScale, yMax, yMin, '');
  for (let i = 0; i <= 5; i++) {
    const val = xMin + (xMax - xMin) * (i / 5);
    const x = xScale(val);
    const t = svgEl('text', { x, y: CHART_H - PAD.bottom + 26, 'text-anchor': 'middle', 'font-size': 16, fill: PALETTE.texto, 'font-family': 'Poppins,sans-serif', 'font-weight': 600 });
    t.textContent = round1(val);
    svg.appendChild(t);
  }
  svg.appendChild(svgEl('line', { x1: PAD.left, x2: PAD.left, y1: PAD.top, y2: CHART_H - PAD.bottom, stroke: '#9aa8bd', 'stroke-width': 1.4 }));
  svg.appendChild(svgEl('line', { x1: PAD.left, x2: CHART_W - PAD.right, y1: CHART_H - PAD.bottom, y2: CHART_H - PAD.bottom, stroke: '#9aa8bd', 'stroke-width': 1.4 }));

  if (trend && points.length > 1) {
    const n = points.length;
    const sx = xs.reduce((a, b) => a + b, 0), sy = ys.reduce((a, b) => a + b, 0);
    const sxy = points.reduce((a, p) => a + p.x * p.y, 0), sxx = xs.reduce((a, b) => a + b * b, 0);
    const b = (n * sxy - sx * sy) / (n * sxx - sx * sx || 1);
    const a = (sy - b * sx) / n;
    const x1 = xMin, x2 = xMax;
    svg.appendChild(svgEl('line', {
      x1: xScale(x1), y1: yScale(a + b * x1), x2: xScale(x2), y2: yScale(a + b * x2),
      stroke: PALETTE.ambar, 'stroke-width': 2.5, 'stroke-dasharray': '7 5'
    }));
  }

  points.forEach(p => {
    svg.appendChild(svgEl('circle', { cx: xScale(p.x), cy: yScale(p.y), r: 7, fill: PALETTE.azul, opacity: .85, stroke: '#fff', 'stroke-width': 1.5 }));
    if (p.label) {
      const t = svgEl('text', { x: xScale(p.x), y: yScale(p.y) - 13, 'text-anchor': 'middle', 'font-size': 14, fill: PALETTE.azulOsc, 'font-family': 'Poppins,sans-serif', 'font-weight': 700 });
      t.textContent = p.label;
      svg.appendChild(t);
    }
  });

  if (xLabel) {
    const t = svgEl('text', { x: CHART_W / 2, y: CHART_H - 4, 'text-anchor': 'middle', 'font-size': 15, fill: PALETTE.texto, 'font-family': 'Poppins,sans-serif', 'font-style': 'italic' });
    t.textContent = xLabel;
    svg.appendChild(t);
  }
  if (yLabel) {
    const t = svgEl('text', { x: 16, y: 18, 'text-anchor': 'start', 'font-size': 15, fill: PALETTE.texto, 'font-family': 'Poppins,sans-serif', 'font-style': 'italic' });
    t.textContent = yLabel;
    svg.appendChild(t);
  }
  return svg;
}

/* ---------------------------- DIAGRAMA DE CAJA (BOXPLOT) ---------------------------- */
function chartBoxplot(opts) {
  const { groups, unit = '', yLabel = '' } = opts; // groups:[{name,min,q1,median,q3,max,outliers:[],color}]
  const svg = baseCanvas();
  const innerW = CHART_W - PAD.left - PAD.right;
  const innerH = CHART_H - PAD.top - PAD.bottom;
  let allVals = [];
  groups.forEach(g => { allVals = allVals.concat([g.min, g.max], g.outliers || []); });
  const dataMax = Math.max(...allVals), dataMin = Math.min(...allVals);
  const span = dataMax - dataMin;
  const yMax = dataMax + span * 0.15, yMin = Math.max(0, dataMin - span * 0.15);
  const yScale = v => PAD.top + innerH - ((v - yMin) / (yMax - yMin)) * innerH;

  axisY(svg, yScale, yMax, yMin, unit);
  svg.appendChild(svgEl('line', { x1: PAD.left, x2: PAD.left, y1: PAD.top, y2: CHART_H - PAD.bottom, stroke: '#9aa8bd', 'stroke-width': 1.4 }));
  svg.appendChild(svgEl('line', { x1: PAD.left, x2: CHART_W - PAD.right, y1: CHART_H - PAD.bottom, y2: CHART_H - PAD.bottom, stroke: '#9aa8bd', 'stroke-width': 1.4 }));

  const n = groups.length;
  const slot = innerW / n;
  const boxW = Math.min(110, slot * 0.42);
  const xs = [];

  groups.forEach((g, i) => {
    const cx = PAD.left + slot * i + slot / 2;
    xs.push(cx);
    const color = g.color || PALETTE.azul;
    // bigote
    svg.appendChild(svgEl('line', { x1: cx, x2: cx, y1: yScale(g.min), y2: yScale(g.q1), stroke: PALETTE.texto, 'stroke-width': 1.6 }));
    svg.appendChild(svgEl('line', { x1: cx, x2: cx, y1: yScale(g.q3), y2: yScale(g.max), stroke: PALETTE.texto, 'stroke-width': 1.6 }));
    svg.appendChild(svgEl('line', { x1: cx - boxW / 4, x2: cx + boxW / 4, y1: yScale(g.min), y2: yScale(g.min), stroke: PALETTE.texto, 'stroke-width': 1.6 }));
    svg.appendChild(svgEl('line', { x1: cx - boxW / 4, x2: cx + boxW / 4, y1: yScale(g.max), y2: yScale(g.max), stroke: PALETTE.texto, 'stroke-width': 1.6 }));
    // caja
    svg.appendChild(svgEl('rect', {
      x: cx - boxW / 2, y: yScale(g.q3), width: boxW, height: Math.max(2, yScale(g.q1) - yScale(g.q3)),
      fill: color, opacity: .22, stroke: color, 'stroke-width': 2, rx: 4
    }));
    // mediana
    svg.appendChild(svgEl('line', { x1: cx - boxW / 2, x2: cx + boxW / 2, y1: yScale(g.median), y2: yScale(g.median), stroke: color, 'stroke-width': 3 }));
    // atípicos
    (g.outliers || []).forEach(o => {
      svg.appendChild(svgEl('circle', { cx, cy: yScale(o), r: 5, fill: '#fff', stroke: PALETTE.rojo, 'stroke-width': 2.2 }));
    });
    // etiquetas Q1/Q2/Q3 pequeñas a la derecha de la caja
    const tag = (val, text) => {
      const t = svgEl('text', { x: cx + boxW / 2 + 8, y: yScale(val) + 4, 'font-size': 14.5, fill: color, 'font-weight': 800, 'font-family': 'Poppins,sans-serif' });
      t.textContent = text;
      svg.appendChild(t);
    };
    tag(g.q3, 'Q3');
    tag(g.median, 'Q2');
    tag(g.q1, 'Q1');
  });
  axisXLabels(svg, xs, groups.map(g => g.name), CHART_H - PAD.bottom);
  return svg;
}

/* ---------------------------- DESPACHADOR ---------------------------- */
function buildChart(block) {
  const box = document.createElement('div');
  box.className = 'chart-svg-box';
  let svg;
  switch (block.chartType) {
    case 'bar': svg = chartBar(block.data); break;
    case 'histogram': svg = chartHistogram(block.data); break;
    case 'line': svg = chartLine(block.data); break;
    case 'scatter': svg = chartScatter(block.data); break;
    case 'boxplot': svg = chartBoxplot(block.data); break;
    default: svg = baseCanvas();
  }
  box.appendChild(svg);
  return box;
}

</script>
<script>
/* ======================================================================
   app.js — Motor de la presentación interactiva.
   Lee la estructura de datos definida en content.js (objeto COURSE) y
   construye cada diapositiva de forma dinámica, gestiona la navegación,
   el índice, la barra de progreso, los ejercicios con solución oculta,
   las preguntas de comprobación y el revelado progresivo de elementos.
   No depende de frameworks: solo JavaScript nativo + KaTeX (fórmulas).
   ====================================================================== */

(function () {
  'use strict';

  let FLAT = [];      // lista plana de todas las diapositivas (con referencia a su módulo)
  let INDEX = 0;       // índice actual dentro de FLAT
  let letters = ['A', 'B', 'C', 'D', 'E', 'F'];

  /* ------------------------------------------------------------------ */
  /* Utilidades básicas                                                  */
  /* ------------------------------------------------------------------ */
  function $(sel, ctx) { return (ctx || document).querySelector(sel); }
  function make(tag, className, html) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function kx(expr, display) {
    try {
      return katex.renderToString(expr, { throwOnError: false, displayMode: !!display });
    } catch (e) { return expr; }
  }

  function flattenCourse() {
    FLAT = [];
    COURSE.modules.forEach((mod, mi) => {
      mod.slides.forEach((s, si) => {
        FLAT.push(Object.assign({}, s, { _mi: mi, _si: si, _modLabel: mod.label, _modId: mod.id }));
      });
    });
  }

  /* ------------------------------------------------------------------ */
  /* Renderizado de bloques de contenido                                 */
  /* ------------------------------------------------------------------ */
  function renderBlocks(blocks) {
    const wrap = document.createDocumentFragment();
    (blocks || []).forEach(b => {
      const node = renderBlock(b);
      if (node) { node.classList.add('reveal-item'); wrap.appendChild(node); }
    });
    return wrap;
  }

  function renderBlock(b) {
    switch (b.type) {
      case 'lead': return make('div', 'b-lead', b.text);
      case 'paragraph': return make('p', 'b-paragraph', b.text);
      case 'list': return renderList(b);
      case 'cards': return renderCards(b);
      case 'table': return renderTable(b);
      case 'callout': return renderCallout(b);
      case 'formula': return renderFormula(b);
      case 'formularow': return renderFormulaRow(b);
      case 'compare': return renderCompare(b);
      case 'quote': return renderQuote(b);
      case 'exercise': return renderExercise(b);
      case 'quiz': return renderQuiz(b);
      case 'reflect': return renderReflect(b);
      case 'steps': return renderSteps(b);
      case 'chart': return renderChartBlock(b);
      case 'spacer': return make('div', '', '');
      default: return null;
    }
  }

  function renderList(b) {
    const tag = b.ordered ? 'ol' : 'ul';
    const cls = 'b-list ' + (b.ordered ? 'ordered' : (b.check ? 'check' : 'bulleted'));
    const el = make(tag, cls);
    (b.items || []).forEach(it => { const li = make('li', '', it); el.appendChild(li); });
    return el;
  }

  function renderCards(b) {
    const el = make('div', 'b-cards c' + (b.columns || 3));
    (b.items || []).forEach(it => {
      const c = make('div', 'card' + (it.accent ? ' accent' : ''));
      if (it.icon) c.appendChild(make('div', 'card-ico', it.icon));
      if (it.title) c.appendChild(make('div', 'card-title', it.title));
      if (it.text) c.appendChild(make('div', 'card-text', it.text));
      el.appendChild(c);
    });
    return el;
  }

  function renderTable(b) {
    const wrap = make('div', 'b-table');
    const table = make('table');
    if (b.caption) table.appendChild(make('caption', '', b.caption));
    if (b.headers) {
      const thead = make('thead');
      const tr = make('tr');
      b.headers.forEach(h => tr.appendChild(make('th', h.num ? 'num' : '', h.text !== undefined ? h.text : h)));
      thead.appendChild(tr);
      table.appendChild(thead);
    }
    const tbody = make('tbody');
    (b.rows || []).forEach(row => {
      const tr = make('tr');
      row.forEach(cell => {
        const isObj = cell && typeof cell === 'object';
        const td = make('td', (isObj && cell.num ? 'num ' : '') + (isObj && cell.hl ? 'hl' : ''));
        td.innerHTML = isObj ? cell.text : cell;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  const CALLOUT_ICON = { importante: '!', recuerda: '★', ejemplo: '✎', error: '⚠', aplicacion: '➜' };
  const CALLOUT_LABEL = { importante: 'Importante', recuerda: 'Recuerda', ejemplo: 'Ejemplo', error: 'Error frecuente', aplicacion: 'Aplicación' };
  function renderCallout(b) {
    const el = make('div', 'b-callout ' + b.variant);
    el.appendChild(make('div', 'co-ico', CALLOUT_ICON[b.variant] || 'i'));
    const body = make('div');
    body.appendChild(make('span', 'co-title', b.title || CALLOUT_LABEL[b.variant]));
    body.appendChild(make('div', '', b.text));
    el.appendChild(body);
    return el;
  }

  function renderFormula(b) {
    const el = make('div', 'b-formula');
    if (b.label) el.appendChild(make('div', 'f-label', b.label));
    el.appendChild(make('div', 'f-expr', kx(b.expr, true)));
    if (b.vars && b.vars.length) {
      const v = make('div', 'f-vars');
      b.vars.forEach(x => {
        const d = make('div');
        d.appendChild(make('span', 'sym', kx(x.symbol, false)));
        d.appendChild(make('span', '', x.desc));
        v.appendChild(d);
      });
      el.appendChild(v);
    }
    if (b.note) el.appendChild(make('div', 'f-note', b.note));
    return el;
  }

  function renderFormulaRow(b) {
    const el = make('div', 'b-formularow c' + (b.columns || (b.formulas || []).length));
    (b.formulas || []).forEach(f => el.appendChild(renderFormula(f)));
    return el;
  }

  function renderCompare(b) {
    const el = make('div', 'b-compare');
    (b.columns || []).forEach(col => {
      const c = make('div', 'cmp-col');
      const head = make('div', 'cmp-head');
      head.appendChild(make('span', 'cmp-dot')).style.background = col.color || '#2563a8';
      head.appendChild(make('span', 'cmp-title', col.title));
      c.appendChild(head);
      const ul = make('ul');
      (col.items || []).forEach(it => ul.appendChild(make('li', '', it)));
      c.appendChild(ul);
      el.appendChild(c);
    });
    return el;
  }

  function renderQuote(b) {
    const el = make('div', 'b-quote');
    el.appendChild(make('div', 'q-text', b.text));
    if (b.author) el.appendChild(make('span', 'q-author', '— ' + b.author));
    return el;
  }

  function renderSteps(b) {
    const wrap = make('div');
    if (b.title) wrap.appendChild(make('div', 'card-title', b.title));
    const line = make('div', 'stepline');
    (b.items || []).forEach((it, i) => {
      const item = make('div', 'sl-item');
      item.appendChild(make('div', 'sl-num', String(i + 1)));
      item.appendChild(make('div', 'sl-title', it.title));
      item.appendChild(make('div', 'sl-text', it.text));
      line.appendChild(item);
    });
    wrap.appendChild(line);
    return wrap;
  }

  function renderChartBlock(b) {
    const el = make('div', 'chart-wrap');
    const head = make('div', 'chart-head');
    head.appendChild(make('div', 'chart-title', b.title || ''));
    if (b.pill) head.appendChild(make('span', 'pill ' + (b.pillVariant || ''), b.pill));
    el.appendChild(head);
    el.appendChild(buildChart(b));
    if (b.caption) el.appendChild(make('div', 'chart-caption', b.caption));
    if (b.questions && b.questions.length) {
      const q = make('div', 'chart-questions');
      b.questions.forEach(qq => q.appendChild(make('div', 'cq', '¿' + qq.replace(/^¿|\?$/g, '') + '?')));
      el.appendChild(q);
    }
    return el;
  }

  /* --------------------------- EJERCICIOS --------------------------- */
  /* Cada ejercicio declara `mode`:
       - 'demo'     → ejemplo resuelto por el docente (concepto → ejemplo
                      paso a paso). Puede mostrar Datos/¿Qué se debe
                      encontrar?/fórmula/pasos/respuesta final, con el
                      interruptor "Intentar primero / Ver solución" para
                      dar tiempo de pensar antes de revelar.
       - 'practice' → "Ahora inténtalo tú": actividad para el estudiante.
                      Muestra Caso, Datos y ¿Qué se pide? (preguntas
                      numeradas). NUNCA renderiza pasos, justificación
                      ni respuesta final, aunque el bloque los traiga
                      por error — así el docente puede reutilizar la
                      diapositiva en clase sin filtrar la solución.
     Si `mode` no se especifica, se asume 'demo' (compatibilidad). */
  let exCounter = 0;
  function renderExercise(b) {
    exCounter++;
    const mode = b.mode === 'practice' ? 'practice' : 'demo';
    const el = make('div', 'exercise ' + mode);

    const head = make('div', 'ex-head');
    const defaultBadge = mode === 'practice' ? '✏️ Ahora inténtalo tú' : '👩‍🏫 Ejemplo resuelto';
    head.appendChild(make('span', 'ex-badge', b.badge || defaultBadge));
    head.appendChild(make('h4', '', b.title || ''));
    el.appendChild(head);

    const body = make('div', 'ex-body');
    if (b.statement) {
      const box = make('div', 'ex-box');
      box.appendChild(make('span', 'ex-box-label', 'Caso / contexto'));
      box.appendChild(make('div', 'ex-box-text ex-statement', b.statement));
      body.appendChild(box);
    }

    if (b.data) {
      const box = make('div', 'ex-box');
      box.appendChild(make('span', 'ex-box-label', 'Datos'));
      box.appendChild(make('div', 'ex-box-text', b.data));
      body.appendChild(box);
    }

    if (b.ask && b.ask.length) {
      const ask = make('div', 'ex-ask');
      ask.appendChild(make('span', 'ex-box-label', '¿Qué se pide?'));
      const ol = make('ol');
      b.ask.forEach(q => ol.appendChild(make('li', '', q)));
      ask.appendChild(ol);
      body.appendChild(ask);
    } else if (b.find) {
      const box = make('div', 'ex-box');
      box.appendChild(make('span', 'ex-box-label', '¿Qué se debe encontrar?'));
      box.appendChild(make('div', 'ex-box-text', b.find));
      body.appendChild(box);
    }

    if (b.formulaRef) body.appendChild(renderFormula(b.formulaRef));

    /* A partir de aquí, todo lo relacionado con la solución (pasos,
       justificación y respuesta final) queda excluido por completo
       cuando el ejercicio es de práctica para el estudiante. */
    if (mode === 'demo') {
      const allowTry = b.allowTry !== false;
      if (allowTry) {
        const bar = make('div', 'ex-trybar');
        const btnTry = make('button', 'btn-try', '🤔 Intentar primero');
        const btnSee = make('button', 'btn-try secondary', '👁 Ver solución paso a paso');
        bar.appendChild(btnTry);
        bar.appendChild(btnSee);
        bar.appendChild(make('span', 'ex-hint', 'Piensa tu respuesta antes de revisar el procedimiento.'));
        body.appendChild(bar);

        btnTry.addEventListener('click', () => {
          btnTry.textContent = '✅ ¡Ahora compara tu respuesta!';
          btnTry.disabled = true;
        });
        btnSee.addEventListener('click', () => {
          stepsBox.classList.toggle('shown');
          answerBox.classList.toggle('shown');
          whyBox.classList.toggle('shown');
          btnSee.textContent = stepsBox.classList.contains('shown') ? '🙈 Ocultar solución' : '👁 Ver solución paso a paso';
        });
      }

      var stepsBox = make('div', 'ex-steps' + (allowTry ? '' : ' shown'));
      (b.steps || []).forEach((s, i) => {
        const st = make('div', 'ex-step');
        st.appendChild(make('div', 'step-n', String(i + 1)));
        const sb = make('div', 'step-body');
        sb.appendChild(make('div', 'step-title', s.title));
        if (s.text) sb.appendChild(make('div', 'step-text', s.text));
        if (s.katex) sb.appendChild(make('div', 'step-katex', kx(s.katex, true)));
        st.appendChild(sb);
        stepsBox.appendChild(st);
      });
      body.appendChild(stepsBox);

      var whyBox = make('div', 'ex-why' + (allowTry ? '' : ' shown'), b.why ? ('<b>¿Por qué así?</b> ' + b.why) : '');
      if (b.why) body.appendChild(whyBox);

      var answerBox = make('div', 'ex-answer' + (allowTry ? '' : ' shown'));
      if (b.answer) {
        answerBox.appendChild(make('div', 'aw-ico', '✓'));
        const at = make('div', 'aw-text');
        at.innerHTML = '<b>Respuesta final:</b> ' + b.answer;
        answerBox.appendChild(at);
        body.appendChild(answerBox);
      }
    }

    el.appendChild(body);
    return el;
  }

  /* ------------------------------ QUIZ ------------------------------ */
  function renderQuiz(b) {
    const el = make('div', 'quiz');
    el.appendChild(make('div', 'quiz-tag', b.tag || '🧠 Comprueba si entendiste'));
    el.appendChild(make('div', 'quiz-q', b.question));
    const opts = make('div', 'quiz-opts');
    const feedback = make('div', 'quiz-feedback');

    (b.options || []).forEach((opt, i) => {
      const btn = make('button', 'quiz-opt');
      btn.appendChild(make('span', 'opt-letter', letters[i]));
      btn.appendChild(make('span', '', opt));
      btn.addEventListener('click', () => {
        const allBtns = opts.querySelectorAll('.quiz-opt');
        allBtns.forEach(x => { x.disabled = true; });
        if (i === b.correctIndex) {
          btn.classList.add('correct');
          feedback.className = 'quiz-feedback shown ok';
          feedback.innerHTML = '✅ <div><b>¡Correcto!</b> ' + (b.feedbackCorrect || b.explanation || '') + '</div>';
        } else {
          btn.classList.add('incorrect');
          allBtns[b.correctIndex].classList.add('correct');
          feedback.className = 'quiz-feedback shown bad';
          feedback.innerHTML = '💡 <div><b>No exactamente.</b> ' + (b.feedbackIncorrect || b.explanation || '') + '</div>';
        }
        allBtns.forEach((x, xi) => { if (xi !== i && xi !== b.correctIndex) x.classList.add('dim'); });
      });
      opts.appendChild(btn);
    });
    el.appendChild(opts);
    el.appendChild(feedback);
    return el;
  }

  function renderReflect(b) {
    const el = make('div', 'reflect');
    el.appendChild(make('div', 'rf-ico', '💭'));
    const txt = make('div');
    txt.appendChild(make('div', 'rf-text', b.text));
    if (b.hint) txt.appendChild(make('div', 'rf-hint', b.hint));
    el.appendChild(txt);
    return el;
  }

    if (h.eyebrow) inner.appendChild(make('div', 'hero-eyebrow', h.eyebrow));
    inner.appendChild(make('div', 'hero-title', h.title || slide.title));
    if (h.subtitle) inner.appendChild(make('div', 'hero-subtitle', h.subtitle));
    if (h.meta && h.meta.length) {
      const m = make('div', 'hero-meta');
      h.meta.forEach(x => {
        const d = make('div');
        d.innerHTML = '<b>' + x.value + '</b>' + x.label;
        m.appendChild(d);
      });
      inner.appendChild(m);
    }
    if (h.objectives && h.objectives.length) {
      const wrap = make('div', 'hero-objectives');
      h.objectives.forEach((o, i) => {
        const d = make('div', 'obj');
        d.appendChild(make('div', 'ico', String(i + 1)));
        d.appendChild(make('div', '', o));
        wrap.appendChild(d);
      });
      inner.appendChild(wrap);
    }
    if (slide.kind === 'closing' && h.grid) {
      const cg = make('div', 'closing-grid');
      h.grid.forEach(c => {
        const card = make('div', 'card');
        if (c.icon) card.appendChild(make('div', 'card-ico', c.icon));
        card.appendChild(make('div', 'card-title', c.title));
        card.appendChild(make('div', 'card-text', c.text));
        cg.appendChild(card);
      });
      inner.appendChild(cg);
    }
    el.appendChild(inner);
    return el;

    return `<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
      <circle cx="800" cy="80" r="220" fill="rgba(255,255,255,0.05)"/>
      <circle cx="850" cy="420" r="140" fill="rgba(230,160,26,0.10)"/>
      <path d="M600 500 L680 320 L760 400 L900 180" stroke="rgba(255,255,255,0.15)" stroke-width="3" fill="none"/>
      <circle cx="680" cy="320" r="6" fill="rgba(255,255,255,0.4)"/>
      <circle cx="760" cy="400" r="6" fill="rgba(255,255,255,0.4)"/>
    </svg>`;
  }

  function renderContentSlide(slide) {
    const el = make('div', 'slide kind-content');
    if (slide.eyebrow || slide.tema) {
      const eb = make('div', 'slide-eyebrow');
      if (slide.tema) eb.appendChild(make('span', 'tag', slide.tema));
      if (slide.eyebrow) { if (slide.tema) eb.appendChild(make('span', 'sep', '·')); eb.appendChild(document.createTextNode(slide.eyebrow)); }
      el.appendChild(eb);
    }
    el.appendChild(make('div', 'slide-title', slide.title));
    if (slide.subtitle) el.appendChild(make('div', 'slide-subtitle', slide.subtitle));

    const body = make('div', 'slide-body');
    if (slide.split) {
      const sp = make('div', 'split ' + (slide.split.ratio === 'left' ? 'left-wide' : slide.split.ratio === 'right' ? 'right-wide' : ''));
      const l = make('div', 'split-col'); l.appendChild(renderBlocks(slide.split.left));
      const r = make('div', 'split-col'); r.appendChild(renderBlocks(slide.split.right));
      sp.appendChild(l); sp.appendChild(r);
      body.appendChild(sp);
    } else {
      body.appendChild(renderBlocks(slide.blocks));
    }
    el.appendChild(body);
    return el;
  }

  function renderSlide(slide) {
    let el;
    if (slide.kind === 'portada' || slide.kind === 'section' || slide.kind === 'closing') {
      el = renderHero(slide);
    } else {
      el = renderContentSlide(slide);
    }
    return el;
  }

  /* ------------------------------------------------------------------ */
  /* Navegación y estado global                                         */
  /* ------------------------------------------------------------------ */
  const root = () => $('#slide-root');

  function goTo(newIndex) {
    newIndex = Math.max(0, Math.min(FLAT.length - 1, newIndex));
    const r = root();
    const old = r.querySelector('.slide');
    const doRender = () => {
      r.innerHTML = '';
      const slide = FLAT[newIndex];
      const elx = renderSlide(slide);
      r.appendChild(elx);
      requestAnimationFrame(() => requestAnimationFrame(() => elx.classList.add('active')));
      INDEX = newIndex;
      updateChrome();
      revealOnScroll(elx);
      try { history.replaceState(null, '', '#' + slide.id); } catch (e) {}
    };
    if (old) { old.classList.remove('active'); setTimeout(doRender, 160); }
    else doRender();
  }

  function revealOnScroll(container) {
    const items = container.querySelectorAll('.reveal-item');
    items.forEach((it, i) => { setTimeout(() => it.classList.add('in'), Math.min(40 + i * 45, 480)); });
  }

  function updateChrome() {
    const slide = FLAT[INDEX];
    $('#topbar-slide-title').textContent = slide.title || slide.hero?.title?.replace(/<[^>]+>/g, '') || '';
    const pct = ((INDEX + 1) / FLAT.length) * 100;
    $('#topbar-progress-fill').style.width = pct + '%';
    $('#topbar-counter').textContent = (INDEX + 1) + ' / ' + FLAT.length;
    $('#btn-prev').disabled = INDEX === 0;
    $('#btn-next').disabled = INDEX === FLAT.length - 1;
    updateDots();
    updateTocActive();
  }

  /* --------------------------- DOTS INFERIORES --------------------------- */
  function buildDots() {
    const track = $('#dot-track');
    track.innerHTML = '';
    FLAT.forEach((s, i) => {
      const isSection = s.kind === 'section' || s.kind === 'portada' || s.kind === 'closing';
      const d = make('span', 'dot' + (isSection ? ' section' : ''));
      d.dataset.i = i;
      d.title = s.title || s._modLabel;
      d.addEventListener('click', () => goTo(i));
      track.appendChild(d);
    });
  }
  function updateDots() {
    const dots = $('#dot-track').querySelectorAll('.dot');
    dots.forEach((d, i) => d.classList.toggle('active', i === INDEX));
    const active = dots[INDEX];
    if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }

  /* ------------------------------- TOC ------------------------------- */
  function buildToc() {
    const list = $('#toc-list');
    list.innerHTML = '';
    COURSE.modules.forEach((mod, mi) => {
      const modWrap = make('div', 'toc-module');
      const head = make('button', 'toc-module-head');
      head.appendChild(make('span', 'badge', String(mi + 1)));
      head.appendChild(make('span', '', mod.label));
      head.appendChild(make('span', 'chev', '›'));
      head.addEventListener('click', () => modWrap.classList.toggle('open'));
      modWrap.appendChild(head);

      const sub = make('div', 'toc-sub');
      mod.slides.forEach((s, si) => {
        const item = make('button', 'toc-item');
        item.appendChild(make('span', 'n', String(si + 1).padStart(2, '0')));
        item.appendChild(make('span', '', s.navLabel || s.title || s.hero?.title?.replace(/<[^>]+>/g, '') || '—'));
        item.dataset.mi = mi; item.dataset.si = si;
        item.addEventListener('click', () => {
          const flatIdx = FLAT.findIndex(f => f._mi === mi && f._si === si);
          goTo(flatIdx);
          closeToc();
        });
        sub.appendChild(item);
      });
      modWrap.appendChild(sub);
      list.appendChild(modWrap);
    });
    if (COURSE.modules[0]) list.querySelector('.toc-module').classList.add('open');
  }

  function updateTocActive() {
    const cur = FLAT[INDEX];
    $('#toc-list').querySelectorAll('.toc-item').forEach(it => {
      const match = Number(it.dataset.mi) === cur._mi && Number(it.dataset.si) === cur._si;
      it.classList.toggle('active', match);
      if (match) {
        const modWrap = it.closest('.toc-module');
        if (modWrap) modWrap.classList.add('open');
      }
    });
  }

  function openToc() { $('#toc-panel').classList.add('open'); $('#toc-overlay').classList.add('open'); }
  function closeToc() { $('#toc-panel').classList.remove('open'); $('#toc-overlay').classList.remove('open'); }

  /* ------------------------------------------------------------------ */
  /* Inicialización                                                      */
  /* ------------------------------------------------------------------ */
  function init() {
    flattenCourse();
    buildDots();
    buildToc();

    $('#btn-prev').addEventListener('click', () => goTo(INDEX - 1));
    $('#btn-next').addEventListener('click', () => goTo(INDEX + 1));
    $('#btn-home').addEventListener('click', () => goTo(0));
    $('#btn-toc').addEventListener('click', openToc);
    $('#btn-toc-close').addEventListener('click', closeToc);
    $('#toc-overlay').addEventListener('click', closeToc);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeToc(); return; }
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag === 'BUTTON' || tag === 'INPUT') return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); goTo(INDEX + 1); }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goTo(INDEX - 1); }
      if (e.key === 'Home') { e.preventDefault(); goTo(0); }
      if (e.key === 'End') { e.preventDefault(); goTo(FLAT.length - 1); }
    });

    // swipe táctil simple
    let touchX = null;
    $('#slide-viewport').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
    $('#slide-viewport').addEventListener('touchend', e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 60) { dx < 0 ? goTo(INDEX + 1) : goTo(INDEX - 1); }
      touchX = null;
    }, { passive: true });

    let startIndex = 0;
    if (location.hash) {
      const idx = FLAT.findIndex(s => '#' + s.id === location.hash);
      if (idx >= 0) startIndex = idx;
    }
    goTo(startIndex);

    setTimeout(() => { $('#loading-screen').classList.add('hidden'); }, 350);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
